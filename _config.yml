url: https://reeswrites.com
baseurl: ""
title: "Rees Writes"
author: "Rees D."
description: "Where I blog about my various interests and things that I am working on."
permalink: /posts/:title/
timezone: "America/New_York"
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag
feed:
  disable_in_development: true
  posts_limit: 25
# ── Thoughts (ADR-0001) ────────────────────────────────────────────────────
# Notes published at a lower bar than a post and revised in place.
# NOT a post kind: a thought has no meaningful publication date and no place
# in the chronology, which is exactly what `_posts/` encodes.
collections:
  thought:
    output: true
    permalink: /thought/:name/

defaults:
  - scope:
      path: ""
      type: thought
    values:
      layout: thought
      maturity: seedling

include:
  - .well-known
exclude:
  - input/
  - node_modules/
  - lib/
  - tests/
  - test-results/
  - Gemfile
  - Gemfile.lock
  - Pipfile
  - Pipfile.lock
  - package.json
  - package-lock.json
  - playwright.config.js
  - pyproject.toml
  - README.md
  - docs/
  - .pytest_cache/